name: stimsys
description: "STIMSYS - Student Information Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Supabase
  supabase_flutter: ^2.8.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  
  # State Management
  provider: ^6.1.5+1
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Utils
  intl: ^0.19.0
  crypto: ^3.0.3
  image_picker: ^1.0.4
  table_calendar: ^3.0.9
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/ST1MSYS.jpg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/ST1MSYS.jpg"
